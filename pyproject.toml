[project]
name = "helix-v3"
version = "0.1.0"
requires-python = ">=3.12"
description = "Enterprise MMM Algorithmic Execution System targeting Sharpe > 1.5"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "mplfinance>=0.12.9b7",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    "pandas-stubs~=3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
helix = "helix_v3.orchestrator_v2:main"

[tool.setuptools.packages.find]
include = ["helix_v3*", "config*"]

[tool.pytest.ini_options]
# Only collect from tests/, only test_*.py files. Live-firing manual scripts
# live in tools/manual/ and must never be collected against a real terminal.
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
