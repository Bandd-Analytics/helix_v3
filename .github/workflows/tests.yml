# Real test suite in CI (audit Tier 3.5).
# windows-latest because the MetaTrader5 wheel is Windows-only. The suite
# itself never touches a live terminal (live-firing scripts are quarantined
# in tools/manual/, pytest is pinned to tests/test_*.py in pyproject.toml);
# mt5 API calls without a terminal return None and every code path under
# test either mocks them or handles that.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Run suite
        env:
          MPLBACKEND: Agg  # headless matplotlib
        run: pytest tests/ -q
